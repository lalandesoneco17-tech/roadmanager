<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>RoadManager</title>
<link rel="icon" type="image/png" href="icone.png"/>
<link rel="apple-touch-icon" href="icone-180.png"/>

<meta name="theme-color" content="#000000"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="RoadManager"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<!-- babel (3140 Ko) est charge a la demande, uniquement si la traduction n est pas deja en memoire -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* pas de zoom : on monte, on descend, c est tout. pan-x reste autorise pour les tableaux larges */
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
/* la carte Leaflet gere son propre pincer-zoomer en JS */
.leaflet-container{touch-action:none}
@keyframes rm-tourne{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes rm-part{to{opacity:0;visibility:hidden}}
#ecran-demarrage.fini{animation:rm-part .35s ease forwards}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8fafc;color:#1e293b}
input,select,textarea,button{font-family:inherit;font-size:inherit}
@media(max-width:768px){
  .mob-btn{display:block!important}
  .sb{position:fixed!important;left:-170px!important;top:0;height:100vh;transition:left .25s;z-index:200!important}
  .sb.open{left:0!important}
  .main{padding:8px!important;padding-top:44px!important;margin-left:0!important}
  .pg{grid-template-columns:1fr!important}
  .grid-cards{grid-template-columns:1fr!important}
  .sb-overlay{display:block!important}
}
@media(min-width:769px){
  .mob-btn{display:none!important}
  .sb-overlay{display:none!important}
}
.rmc{
  --ground:#F4F7F5; --surface:#FFFFFF; --surface-2:#EDF2EF;
  --line:#D8E2DC; --ink:#0E1A15; --ink-2:#3B4A43; --ink-3:#6B7C74;
  --vert:#2E7D5B; --vert-fonce:#1C5340; --vert-pale:#DCEBE3;
  --nuit:#A8451B; --nuit-pale:#F7E5DC;
  --pause:#B07407; --pause-pale:#F6EBD4;
  --trajet:#3F6DA8; --trajet-pale:#E2EAF4;
  --fili-encre:#0E1A15; --fili-melange:multiply; --fili-force:.09;
  --frame:#0E1A15;
}
@media (prefers-color-scheme: dark){ .rmc{
    --ground:#0C1512; --surface:#131F1A; --surface-2:#1A2822;
    --line:#25352D; --ink:#EAF2ED; --ink-2:#AEC0B7; --ink-3:#7C8F86;
    --vert:#4FAE81; --vert-fonce:#8FD3B2; --vert-pale:#17362A;
    --nuit:#E58A5E; --nuit-pale:#3A2015;
    --pause:#D9A13B; --pause-pale:#31260F;
    --trajet:#77A6DE; --trajet-pale:#16263A;
    --fili-encre:#FFFFFF; --fili-melange:screen; --fili-force:.10;
    --frame:#000000;
  }
}
.rmc[data-sombre]{
  --ground:#0C1512; --surface:#131F1A; --surface-2:#1A2822;
  --line:#25352D; --ink:#EAF2ED; --ink-2:#AEC0B7; --ink-3:#7C8F86;
  --vert:#4FAE81; --vert-fonce:#8FD3B2; --vert-pale:#17362A;
  --nuit:#E58A5E; --nuit-pale:#3A2015;
  --pause:#D9A13B; --pause-pale:#31260F;
  --trajet:#77A6DE; --trajet-pale:#16263A;
  --fili-encre:#FFFFFF; --fili-melange:screen; --fili-force:.10;
  --frame:#000000;
}
.rmc .zonefil, .rmc .liste-jours, .rmc .chaine{overflow-x:hidden}
.rmc .tel, .rmc .ecran, .rmc .vue, .rmc .corps, .rmc .pied-fixe{min-width:0}
/* aucune grille ne doit refuser de retrecir : sinon l ecran deborde */
.contacts>*,.duo>*,.duo-bas>*,.f-duo>*,.bornes>*,.ev.fin>*{min-width:0}
@media(max-width:820px){ .rmc .scene{grid-template-columns:1fr}}
.rmc button.contact{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
  border-radius:12px;padding:8px 10px;min-height:54px;width:100%;
  font-family:"IBM Plex Sans",sans-serif;font-size:13.5px;font-weight:600;letter-spacing:0;
  text-transform:none;text-align:left;display:flex;gap:9px;align-items:center}
.rmc button.contact .ic{font-size:19px;flex-shrink:0}
.rmc button.contact .txt{min-width:0}
.rmc button.contact .txt b{display:block;font-weight:600;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmc button.contact .txt small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3);
  margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmc button.contact:hover{border-color:var(--vert)}
.rmc button.contact.vide{border-style:dashed;color:var(--ink-3);background:transparent}
.rmc button.contact.vide:hover{border-color:var(--pause)}
.rmc button.manque{margin-top:8px;width:100%;background:transparent;border:1.5px dashed var(--pause);
  color:var(--pause);font-size:13.5px;padding:8px;border-radius:11px;letter-spacing:.03em}
.rmc button.manque:hover{background:var(--pause-pale)}
.rmc button.manque.discret{border-color:var(--line);color:var(--ink-3)}
.rmc button.manque.discret:hover{background:var(--surface-2)}
/* la feuille qui monte du bas */
.voile{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:5;
  opacity:0;pointer-events:none;transition:opacity .2s}
.rmc .voile.on{opacity:1;pointer-events:auto}
.rmc .feuille{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--surface);
  border-radius:20px 20px 0 0;padding:13px 14px 16px;transform:translateY(103%);
  transition:transform .26s ease;box-shadow:0 -14px 34px -14px rgba(0,0,0,.45)}
.rmc .feuille.on{transform:none}
.rmc .f-poignee{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 11px}
.rmc .f-titre{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;line-height:1.15}
.rmc .f-sous{font-size:13px;color:var(--ink-3);margin-top:2px}
.rmc .f-tel{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:27px;
  font-variant-numeric:tabular-nums;margin-top:7px;letter-spacing:.02em}
.rmc .f-actions{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rmc .f-duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rmc .f-carte{margin-top:11px;height:118px;border-radius:12px;border:1px solid var(--line);
  background:
    repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 26px),
    var(--surface-2);
  display:grid;place-items:center;font-size:31px}
.rmc .f-choix{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.rmc button.choix{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
  font-family:"IBM Plex Sans",sans-serif;font-size:14px;font-weight:600;letter-spacing:0;
  text-transform:none;text-align:left;padding:11px 12px;border-radius:11px;width:100%}
.rmc button.choix:hover{border-color:var(--pause)}
.rmc .f-envoye{background:var(--vert-pale);border:1px solid var(--vert);border-radius:12px;
  padding:10px 11px;margin-top:11px;font-size:13px;color:var(--ink-2);line-height:1.4}
.rmc .f-envoye b{color:var(--vert-fonce)}
.rmc .corps{padding:13px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.rmc .zonefil{flex:1;min-height:0;overflow-y:auto;margin:0 -13px;padding:0 13px}
.rmc .zonefil::-webkit-scrollbar{width:0}
/* la barre du bas : tout est ramene a la ligne, rien n'y depasse */
.pied-fixe{border-top:1px solid var(--line);background:var(--surface-2);
  padding:3px 12px 4px;display:flex;flex-direction:column;gap:2px;transition:background .25s}
.rmc .pied-fixe.confirme{background:var(--vert-pale)}
.rmc .duo-bas{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rmc .demain{padding:0}
.rmc .dem-tete{display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:11px;line-height:1.35;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.rmc .pied-fixe.confirme .dem-tete{color:var(--vert-fonce)}
.rmc button.chip{width:auto;padding:1px 8px 2px;font-size:11.5px;line-height:1.45;
  border-radius:999px;letter-spacing:.04em}
.rmc .vu{font-family:"Barlow Condensed",sans-serif;font-size:11.5px;letter-spacing:.04em;
  color:var(--vert-fonce);white-space:nowrap}
.rmc .dem-liste{display:flex;flex-direction:column}
.rmc .dl{display:flex;gap:8px;align-items:baseline;font-size:12px;line-height:1.26}
.rmc .dl b{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13px;color:var(--vert);
  min-width:34px;font-variant-numeric:tabular-nums;line-height:1.26}
.rmc .pied-fixe.confirme .dl b{color:var(--vert-fonce)}
.rmc .dl-lieu{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmc .dl-cli{color:var(--ink-3);font-size:11.5px;white-space:nowrap}
.rmc button.dl{width:100%;background:transparent;border:0;padding:0;text-align:left;
  font-family:inherit;text-transform:none;letter-spacing:0;color:inherit}
/* deplie : la barre prend la moitie de l'ecran, les trois fiches y tiennent */
.pied-fixe.ouvert{height:50%;padding-bottom:6px}
.rmc .pied-fixe.ouvert .demain{flex:1;min-height:0;display:flex;flex-direction:column}
.rmc .pied-fixe.ouvert .dem-liste{flex:1;min-height:0;display:flex;flex-direction:column;
  justify-content:space-between;gap:5px;margin-top:5px}
.rmc .df{background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:6px 8px;display:flex;gap:9px;align-items:center}
.rmc .df-h{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;color:var(--vert);
  font-variant-numeric:tabular-nums;flex-shrink:0}
.rmc .df-txt{flex:1;min-width:0}
.rmc .df-lieu{font-size:13.5px;font-weight:700;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmc .df-sous{font-size:11px;color:var(--ink-3);line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmc .df-act{display:flex;gap:5px;flex-shrink:0}
.rmc button.ico{width:36px;height:36px;padding:0;border-radius:9px;font-size:13.5px;line-height:1;
  display:grid;place-items:center;overflow:hidden;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.rmc button.ico.vide{border-style:dashed;opacity:.5}
.rmc button.ico.alerte{border-color:var(--pause);color:var(--pause);background:transparent}
.rmc button.replier{width:100%;background:transparent;border:0;color:var(--ink-3);
  font-size:12px;padding:3px;letter-spacing:.08em}
.rmc button.creux.petit{font-size:12.5px;padding:4px;border-radius:9px;line-height:1.35}
.rmc button.creux.heures{font-size:13.5px;padding:6px;border-radius:10px}
/* ecran Mes heures */
.vue{display:flex;flex-direction:column;flex:1;min-height:0;position:relative}
/* le monogramme en filigrane, fixe, derriere le fil qui defile */
.filigrane{position:absolute;inset:0;z-index:3;pointer-events:none;
  display:grid;place-items:center;mix-blend-mode:var(--fili-melange);opacity:var(--fili-force)}

.rmc .vue[hidden]{display:none}
.rmc .tete-vue{display:flex;align-items:center;gap:9px;padding:9px 13px 8px;border-bottom:1px solid var(--line)}
.rmc .tete-vue h3{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;margin:0;flex:1;
  min-width:0;line-height:1.1}
.rmc button.retour{width:auto;background:transparent;color:var(--ink-2);border:1.5px solid var(--line);
  padding:4px 10px 5px;font-size:14px;border-radius:10px}
/* la page ouverte par la pastille */
.tete-vue .sous{display:block;font-size:11.5px;line-height:1.3;color:var(--ink-3);font-weight:400;margin-top:1px;
  font-family:"IBM Plex Sans",sans-serif;letter-spacing:0;text-transform:none}
.rmc .groupe{margin-top:14px}
.rmc .groupe:first-child{margin-top:2px}
.rmc .groupe h4{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:11.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px 2px}
.rmc .menu{display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line);border-radius:13px;overflow:hidden}
.rmc button.item{width:100%;background:transparent;border:0;border-top:1px solid var(--line);
  font-family:"IBM Plex Sans",sans-serif;font-size:14px;font-weight:600;letter-spacing:0;
  text-transform:none;text-align:left;color:var(--ink);
  padding:11px 12px;min-height:48px;display:flex;gap:11px;align-items:center}
.rmc .menu button.item:first-child{border-top:0}
.rmc button.item:hover{background:var(--surface-2)}
.rmc button.item .ic{font-size:16px;width:26px;min-width:26px;flex-shrink:0;
  text-align:center;line-height:1.2;overflow:visible}
.rmc button.item .lb{flex:1;min-width:0}
.rmc button.item .lb small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.rmc button.item .fl{color:var(--ink-3);font-size:15px;flex-shrink:0}
.rmc button.item .pastille-nb{background:var(--vert);color:#fff;border-radius:999px;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:12px;
  padding:1px 7px 2px;flex-shrink:0}
.rmc button.item.sortie{color:var(--nuit)}
.rmc button.item.sortie .ic{color:var(--nuit)}
.rmc .liste-jours{flex:1;min-height:0;overflow-y:auto;padding:11px 13px 16px;
  display:flex;flex-direction:column;gap:10px}
.rmc .liste-jours::-webkit-scrollbar{width:0}
.rmc .alerte{display:flex;gap:8px;align-items:flex-start;background:var(--pause-pale);
  border:1px solid var(--pause);border-radius:12px;padding:8px 10px;font-size:12.5px;color:var(--ink-2)}
.rmc .alerte b{color:var(--pause)}
.rmc .jour{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 11px}
.rmc .jour.souci{border-color:var(--pause)}
.rmc .jour-tete{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;
  letter-spacing:0;color:var(--ink);line-height:1.1}
.rmc .jour-tete .tot{font-size:22px;color:var(--vert);font-variant-numeric:tabular-nums}
.rmc .jour.souci .jour-tete .tot{color:var(--pause)}
.rmc .mot-souci{font-size:12px;color:var(--pause);line-height:1.35;margin-top:4px}
/* une seule colonne d'heures a droite ; entre deux heures, ce qui s'est passe */
.chaine{margin-top:9px;display:flex;flex-direction:column;padding-right:17px}
.rmc .ev{display:flex;gap:9px;align-items:center;position:relative;padding-left:10px;min-height:26px}
.rmc .ev .bar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px;background:transparent}
.rmc .ev.dans .bar{background:var(--vert)}
.rmc .ev.pa .bar{background:var(--pause)}
.rmc .ev-txt{flex:1;min-width:0}
.rmc .ev-haut{display:flex;align-items:baseline;gap:7px}
.rmc .ev-t{font-size:13.5px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.rmc .prevu{flex-shrink:0;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12.5px;
  letter-spacing:.03em;color:var(--ink-3);font-variant-numeric:tabular-nums;
  border:1px dashed var(--line);border-radius:7px;padding:0 6px 1px}
.rmc .ev.borne .ev-t{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;
  letter-spacing:.06em;text-transform:uppercase}
.rmc .ev.reprise .ev-t{font-weight:500;font-size:12.5px}
.rmc .ev.pa .ev-t{color:var(--pause)}
/* la fin de chantier : en rouge, et au milieu de la ligne */
.ev.fin{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:9px}
.rmc .ev.fin .ev-t{font-weight:600;font-size:12.5px;color:var(--nuit)}
.rmc .ev.fin .hchip{background:var(--nuit-pale);color:var(--nuit)}
.rmc .ev.fin .hchip:hover{border-color:var(--nuit)}
/* les pauses portent leur couleur jusque dans l'heure pointee */
.ev.pa .hchip{background:var(--pause-pale);color:var(--pause)}
.rmc .ev.pa .hchip:hover{border-color:var(--pause)}
.rmc .ev-s{font-size:11.5px;color:var(--ink-3);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* l'arrivee sur le chantier porte le nom et le client : on les grossit */
.ev.arrivee{min-height:30px}
.rmc .ev.arrivee .ev-t{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.rmc .ev.arrivee .ev-s{font-size:13px;color:var(--ink-2);font-weight:500;margin-top:1px}
/* un trait ferme chaque chantier : on les distingue quand il y en a trois */
.sep{height:1px;background:var(--line);margin:9px 0 9px 10px}
/* l'intervalle : sa nature et sa duree a gauche ; la colonne de droite reste aux heures pointees */
.gap{display:flex;gap:7px;align-items:center;padding-left:10px;position:relative;min-height:22px}
.rmc .gap::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px}
.rmc .gap.chantier::before{background:var(--vert)}
.rmc .gap.pause::before{background:var(--pause)}
.rmc .gap.trajet::before{left:1px;width:2px;
  background:repeating-linear-gradient(var(--trajet) 0 3px,transparent 3px 7px)}
.rmc .gap-t{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:11.5px;
  letter-spacing:.11em;text-transform:uppercase}
.rmc .gap-d{font-family:"Barlow Condensed",sans-serif;font-weight:700;
  font-size:13.5px;font-variant-numeric:tabular-nums;border-radius:7px;padding:1px 7px 2px}
.rmc .gap.chantier .gap-t, .rmc .gap.chantier .gap-d{color:var(--vert)}
.rmc .gap.chantier .gap-d{background:var(--vert-pale)}
.rmc .gap.trajet .gap-t, .rmc .gap.trajet .gap-d{color:var(--trajet)}
.rmc .gap.trajet .gap-d{background:var(--trajet-pale)}
.rmc .gap.pause .gap-t, .rmc .gap.pause .gap-d{color:var(--pause)}
.rmc .gap.pause .gap-d{background:var(--pause-pale)}
.rmc .hh{display:flex;gap:3px;align-items:baseline;flex-shrink:0}
.rmc button.hchip{width:auto;min-width:66px;text-align:center;background:var(--surface-2);color:var(--ink);
  border:1px solid transparent;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;
  letter-spacing:0;padding:2px 7px 3px;border-radius:8px;font-variant-numeric:tabular-nums;text-transform:none}
.rmc button.hchip:hover{border-color:var(--vert)}
.rmc button.hchip.vide{color:var(--ink-3)}
.rmc button.hchip.souci{background:var(--pause-pale);color:var(--pause);border-color:var(--pause)}
.rmc button.croix{width:15px;background:transparent;color:var(--ink-3);border:0;padding:0;
  font-size:16px;line-height:1;flex-shrink:0;position:absolute;right:-17px}
.rmc button.croix:hover{color:var(--pause)}
.rmc button.ajout{width:auto;background:transparent;border:1.5px dashed var(--line);color:var(--ink-3);
  font-size:12.5px;padding:4px 10px;border-radius:9px;margin-top:9px;letter-spacing:.03em}
.rmc button.ajout:hover{border-color:var(--pause);color:var(--pause)}
.rmc input.heure{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;
  background:var(--surface);color:var(--ink);border:1.5px solid var(--vert);border-radius:8px;
  padding:1px 4px;width:78px}
/* le decompte */
.bilan{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;
  display:flex;flex-direction:column;gap:2px}
.rmc .bl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:12.5px;color:var(--ink-3)}
.rmc .bl b{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;
  color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:66px;text-align:center}
.rmc .bl.ch b{color:var(--vert)}
.rmc .bl.tr b{color:var(--trajet)}
.rmc .bl.moins b{color:var(--pause)}
.rmc .bl.paye{margin-top:3px;padding-top:5px;border-top:1px solid var(--line);color:var(--ink);font-weight:600}

<script>
// ---------------------------------------------------------------------------
// Demarrage : la traduction du fichier par Babel prend 6 a 10 s sur telephone et
// etait refaite a CHAQUE ouverture. On la garde donc en memoire dans l'appareil,
// rangee sous une empreinte du fichier source : si le code n'a pas change, on
// reutilise la traduction et Babel (3 Mo) n'est meme pas telecharge.
// En cas de pepin, on retombe sur l'ancienne methode : l'app demarre toujours.
// ---------------------------------------------------------------------------
// Retire l'ecran noir des que l'application est affichee.
(function(){
  var e=document.getElementById('ecran-demarrage');
  if(!e) return;
  var t0=Date.now();
  var iv=setInterval(function(){
    var r=document.getElementById('root');
    if((r&&r.children.length)||Date.now()-t0>30000){clearInterval(iv);e.className='fini';setTimeout(function(){e.remove();},400);}
  },80);
})();
(function(){
  var SRC='app.v6.jsx', CLE='rm-compile-';
  function repli(){
    var pose=function(){var s=document.createElement('script');s.type='text/babel';s.src=SRC+'?t='+Date.now();document.head.appendChild(s);};
    if(window.Babel) return pose();
    var b=document.createElement('script');
    b.src='https://unpkg.com/@babel/standalone@7.29.7/babel.min.js';
    b.onload=pose; document.head.appendChild(b);
  }
  function empreinte(t){var h=5381;for(var i=0;i<t.length;i++){h=((h*33)^t.charCodeAt(i))>>>0;}return h.toString(36)+'-'+t.length;}
  function executer(code){
    try{
      var b=new Blob([code],{type:'text/javascript'});
      var s=document.createElement('script');
      s.src=URL.createObjectURL(b);
      s.onerror=repli;
      document.head.appendChild(s);
    }catch(e){repli();}
  }
  function babelPuisExecuter(src,cle){
    var s=document.createElement('script');
    s.src='https://unpkg.com/@babel/standalone@7.29.7/babel.min.js';
    s.onload=function(){
      try{
        var code=window.Babel.transform(src,{presets:['react']}).code;
        try{ for(var i=localStorage.length-1;i>=0;i--){var k=localStorage.key(i); if(k&&k.indexOf(CLE)===0&&k!==cle) localStorage.removeItem(k);} localStorage.setItem(cle,code); }catch(e2){}
        executer(code);
      }catch(e){repli();}
    };
    s.onerror=repli;
    document.head.appendChild(s);
  }
  fetch(SRC,{cache:'no-cache'}).then(function(r){return r.text();}).then(function(src){
    var cle=CLE+empreinte(src), cache=null;
    try{cache=localStorage.getItem(cle);}catch(e){}
    if(cache){executer(cache);} else {babelPuisExecuter(src,cle);}
  }).catch(repli);
})();
</script>
